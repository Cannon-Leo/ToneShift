<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToneShift — Instant Local Copy Tone Transformer</title>
  <meta name="description" content="Transform raw copy into Executive, Ruthlessly Concise, Friendly UX, and Casual Social tones instantly and 100% locally.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ambient background lighting effects -->
  <div class="ambient-glow glow-1" aria-hidden="true"></div>
  <div class="ambient-glow glow-2" aria-hidden="true"></div>
  <div class="ambient-glow glow-3" aria-hidden="true"></div>

  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand-wrapper">
        <div class="brand-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m16 3 4 4-4 4"/>
            <path d="M20 7H4"/>
            <path d="m8 21-4-4 4-4"/>
            <path d="M4 17h16"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>Tone<span class="gradient-text">Shift</span></h1>
          <p class="tagline">Local rule-based copy transformer</p>
        </div>
      </div>
      
      <div class="header-badges">
        <span class="badge badge-glow">
          <span class="status-dot"></span> 100% Local &amp; Private
        </span>
        <span class="badge badge-subtle">Zero API Keys</span>
      </div>
    </header>

    <!-- Main Content Shell -->
    <main class="main-layout">
      <section class="panel glass-panel input-panel" aria-label="Input Copy Section">
        <!-- Input section placeholder -->
      </section>
      <section class="output-section" aria-label="Transformed Copy Variations">
        <!-- Output section placeholder -->
      </section>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <div class="footer-content">
        <p class="footer-brand"><strong>ToneShift</strong> — 100% Client-side text tone synthesis</p>
      </div>
    </footer>
  </div>
</body>
</html>
